<div class="aviso erro" data-bloco-erro data-retry-url="{{ retry }}" role="alert">
<p>{{ message }}</p>
{% if expired %}<a href="{{ reopen }}">Reabrir a tela</a>{% else %}
<a href="{{ retry }}" hx-get="{{ retry }}" hx-target="closest div" hx-swap="outerHTML">Tentar novamente</a>
{% endif %}
<a data-full href="{{ full_url }}">Ver a página inteira</a>
</div>
