{% set row = row|default(false) %}
{% if row %}<tr class="aviso erro" data-bloco-erro data-retry-url="{{ retry }}"><td colspan="4">{% else %}<div class="aviso erro" data-bloco-erro data-retry-url="{{ retry }}">{% endif %}
<p role="alert">{{ message }}</p>
<a href="{{ retry }}" hx-get="{{ retry }}" hx-target="{{ 'closest tr' if row else 'closest div' }}" hx-swap="outerHTML">Tentar novamente</a>
<a data-full href="{{ full_url }}">Ver a página inteira</a>
{% if row %}</td></tr>{% else %}</div>{% endif %}
