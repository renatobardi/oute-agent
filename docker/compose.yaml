name: oute-agent

# stdout dos containers: rotação (sem isso o json-file do Docker cresce sem limite no disco do host).
# Não é a telemetria — essa vai inteira para o bucket (ADR-04) e não é apagada.
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  agent:
    build:
      context: .
      dockerfile: docker/Dockerfile
      platforms: ["linux/arm64"]
      args:
        OUTE_VERSION: ${OUTE_VERSION:-0.0.0-dev}
        OUTE_UID: ${OUTE_UID:-1000}
    image: ghcr.io/renatobardi/oute-agent:${OUTE_VERSION:-latest}
    container_name: oute-agent
    logging: *logging
    hostname: ${OUTE_HOSTNAME:-oute}
    restart: unless-stopped
    ports:
      # só loopback por padrão: host tem IP público e o Docker publica portas por fora do ufw (#17)
      - "${OUTE_SSH_BIND:-127.0.0.1}:${OUTE_SSH_PORT:-2222}:2222"
    environment:
      BW_SERVER: https://vault.oute.pro
      BW_PASSWORD: ${BW_PASSWORD:-}
      BW_SESSION: ${BW_SESSION:-}
      OUTE_VAULT_FOLDER: ${OUTE_VAULT_FOLDER:-oute-agent}
      OUTE_AGENTS: ${OUTE_AGENTS:-pi,claude-code,codex,goose}
      AI_MEMORY_SERVER_URL: http://ai-memory:49374
      AI_MEMORY_AUTH_TOKEN: ${AI_MEMORY_AUTH_TOKEN:-}
      # observabilidade (#13, ADR-04): Claude Code -> otel-collector (conteúdo vai só pro bucket OCI)
      CLAUDE_CODE_ENABLE_TELEMETRY: "1"
      CLAUDE_CODE_ENHANCED_TELEMETRY_BETA: "1"
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_LOG_USER_PROMPTS: "1"
      OTEL_LOG_ASSISTANT_RESPONSES: "1"
      OTEL_LOG_TOOL_DETAILS: "1"
      OTEL_LOG_TOOL_CONTENT: "1"
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=${OUTE_HOSTNAME:-oute}
    # vault.oute.pro só existe no listener Tailscale; containers Docker não herdam /etc/hosts do host
    extra_hosts:
      - "vault.oute.pro:${OUTE_VAULT_HOST_IP:-100.66.254.24}"
    secrets:
      - bw_client
    volumes:
      - oute-workspace:/workspace
      - oute-home:/home/oute
      # mesmo estado do bw que o host usa no `oute up`: a BW_SESSION vale nos dois
      - ${OUTE_HOME:-~/.oute}/bwcli:/home/oute/.config/Bitwarden CLI
      - oute-memory:/data/ai-memory
      - ${OUTE_SHARED_DIR:-~/.oute/shared}:/data/shared
      - ${OUTE_SSH_AUTHORIZED_KEYS:-~/.ssh/id_ed25519.pub}:/etc/oute/authorized_keys:ro
      - ./config/litellm/candidates.json:/etc/oute/candidates.json:ro
    depends_on:
      jev-router:
        condition: service_started
      ai-memory:
        condition: service_started
      otel-collector:
        condition: service_started
    networks: [oute]
    init: true
    tty: true
    stdin_open: true

  jev-router:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: oute-jev-router
    logging: *logging
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-oute-local}
      # callback "otel" (config.yaml gerado): spans com modelo servido, tokens, custo e metadata do Jev
      OTEL_EXPORTER: otlp_grpc
      OTEL_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: jev-router
    volumes:
      - ./config/litellm/config.yaml:/app/config.yaml:ro
      - ./config/litellm/router.yaml:/app/router.yaml:ro
      - ./config/litellm/jev_hook.py:/app/jev_hook.py:ro
    networks: [oute]

  ai-memory:
    image: akitaonrails/ai-memory:latest
    container_name: oute-ai-memory
    logging: *logging
    restart: unless-stopped
    # mesmo uid do agent: o volume oute-memory é compartilhado (/data aqui, /data/ai-memory lá)
    user: "${OUTE_UID:-1000}:${OUTE_UID:-1000}"
    command: ["serve", "--transport", "http", "--bind", "0.0.0.0:49374", "--enable-web"]
    environment:
      # o servidor rejeita Host: fora desta lista; "ai-memory" é o nome DNS na rede oute
      AI_MEMORY_ALLOWED_HOSTS: "localhost,127.0.0.1,::1,ai-memory,oute-ai-memory"
      AI_MEMORY_AUTH_TOKEN: ${AI_MEMORY_AUTH_TOKEN:-}
      AI_MEMORY_LLM_PROVIDER: ${AI_MEMORY_LLM_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - oute-memory:/data
    networks: [oute]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OUTE_OTELCOL_VERSION:-0.161.0}
    container_name: oute-otel-collector
    logging: *logging
    restart: unless-stopped
    # sem porta publicada: só a rede "oute" enxerga (4317 gRPC, 4318 HTTP). Broadcast externo = fase 2, via vhost nginx.
    command:
      - --config=/etc/otelcol/collector.yaml
      - --config=/etc/otelcol/${OUTE_OTEL_LANGFUSE:-none}.yaml
    environment:
      OUTE_HOSTNAME: ${OUTE_HOSTNAME:-oute}
      # credencial S3 do item oci-storage (usuário de serviço só nos buckets do oute-agent)
      AWS_ACCESS_KEY_ID: ${OCI_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${OCI_S3_SECRET_KEY:-}
      OCI_S3_REGION: ${OCI_S3_REGION:-sa-saopaulo-1}
      OCI_S3_ENDPOINT: ${OCI_S3_ENDPOINT:-}
      # SDK AWS v2 (2025+) manda checksum CRC32 com "aws-chunked" por padrão; OCI responde 501 NotImplemented.
      # when_required = só calcula checksum quando a operação exige (comportamento antigo, compatível com S3-compat).
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      OUTE_LANGFUSE_AUTH: ${OUTE_LANGFUSE_AUTH:-}
    volumes:
      - ./config/otel:/etc/otelcol:ro
    networks: [oute]

secrets:
  bw_client:
    # arquivo com BW_CLIENTID=... e BW_CLIENTSECRET=... (API key do Vaultwarden), 0600
    file: ${OUTE_BW_CLIENT_FILE:-~/.oute/bw_client.env}

volumes:
  oute-workspace:
  oute-home:
  oute-memory:

networks:
  oute:
    driver: bridge
