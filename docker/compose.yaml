name: oute-agent

# stdout dos containers: rotação (sem isso o json-file do Docker cresce sem limite no disco do host).
# Não é a telemetria — essa vai inteira para o bucket (ADR-04) e não é apagada.
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  agent:
    build:
      context: .
      dockerfile: docker/Dockerfile
      platforms: ["linux/arm64"]
      args:
        OUTE_VERSION: ${OUTE_VERSION:-0.0.0-dev}
    image: ghcr.io/renatobardi/oute-agent:${OUTE_VERSION:-latest}
    container_name: oute-agent
    logging: *logging
    hostname: ${OUTE_HOST:-oute}
    restart: unless-stopped
    ports:
      # só loopback por padrão: host tem IP público e o Docker publica portas por fora do ufw (#17)
      - "${OUTE_SSH_BIND:-127.0.0.1}:${OUTE_SSH_PORT:-2222}:2222"
    environment:
      OUTE_AGENTS: ${OUTE_AGENTS:-claude-code,codex}
      # agentes sem prompts de aprovação dentro do container (ADR-01); 0 = padrão de cada agente
      OUTE_AGENT_YOLO: ${OUTE_AGENT_YOLO:-1}
      AI_MEMORY_SERVER_URL: http://ai-memory:49374
      AI_MEMORY_AUTH_TOKEN: ${AI_MEMORY_AUTH_TOKEN:-}
      # observabilidade (#13, ADR-04): Claude Code -> otel-collector (conteúdo vai só pro bucket OCI)
      CLAUDE_CODE_ENABLE_TELEMETRY: "1"
      # memória única = ai-memory: desliga a auto memory nativa do Claude Code (~/.claude/projects/*/memory)
      CLAUDE_CODE_DISABLE_AUTO_MEMORY: "1"
      CLAUDE_CODE_ENHANCED_TELEMETRY_BETA: "1"
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_LOG_USER_PROMPTS: "1"
      OTEL_LOG_ASSISTANT_RESPONSES: "1"
      OTEL_LOG_TOOL_DETAILS: "1"
      OTEL_LOG_TOOL_CONTENT: "1"
      # origem = máquina + instância (o `oute` resolve OUTE_HOST/OUTE_INSTANCE; o collector reforça em tudo)
      OUTE_HOST: ${OUTE_HOST:-oute}
      OUTE_INSTANCE: ${OUTE_INSTANCE:-oute-agent}
      OTEL_RESOURCE_ATTRIBUTES: host.name=${OUTE_HOST:-oute},oute.instance=${OUTE_INSTANCE:-oute-agent},deployment.environment=${OUTE_HOST:-oute}
      # agent-studio (#259): onde a ops-observe lê (GET /v1/usage e /v1/alerts), com a credencial de leitura que vem
      # no agent_env. O `oute up` escolhe por host: rede docker no oute-server, vhost da tailnet no Mac
      AGENT_STUDIO_URL: ${AGENT_STUDIO_URL:-http://agent-studio:8430}
    # #6: sem acesso ao Vaultwarden (nem DNS do vault): só os valores da pasta oute-agent, resolvidos no host.
    # #256: segredo de serviço (pasta oute-services: ingestão do agent-studio, root do SurrealDB) nunca entra aqui,
    # nem no arquivo nem no environment acima; do agent-studio o agent só tem a credencial de leitura.
    secrets:
      - agent_env
    volumes:
      - oute-workspace:/workspace
      - oute-home:/home/oute
      - oute-memory:/data/ai-memory
      # lab#181: só o mount rclone do bucket vem do host (`oute up` exporta o caminho); sem mount, volume docker —
      # nunca um diretório comum na home do host gravável pelo container
      - ${OUTE_SHARED_DIR:-oute-shared}:/data/shared
      - ${OUTE_SSH_AUTHORIZED_KEYS:-~/.ssh/id_ed25519.pub}:/etc/oute/authorized_keys:ro
      # addons (ADR-06): skills do checkout, read-only (agente em yolo não reescreve as próprias skills);
      # skill nova entra com git pull + oute down/up, sem release. O entrypoint linka em ~/.claude e ~/.agents.
      - ./addons:/opt/oute/addons:ro
      # tabela de fase do seletor de modelo (ADR-02, #219), read-only: muda com git pull + oute down/up, sem release
      - ./config/select:/opt/oute/select:ro
    depends_on:
      volume-init:
        condition: service_completed_successfully
      ai-memory:
        condition: service_started
      otel-collector:
        condition: service_started
    networks:
      oute:
        # IP fixo: o host só aceita o usuário oute-ops vindo daqui (lab#178, from="172.19.0.5/32")
        ipv4_address: ${OUTE_AGENT_IP:-172.19.0.5}
      # #564: rede interna só com o ai-memory (hook, MCP e backup falam com ele por aqui)
      memoria:
    init: true
    # teto de memória, CPU, /dev/shm e processos (#570): o oute-agent era o único serviço sem limite e roda as sessões
    # e os testes dos agentes; um vazamento numa sessão comia os 4 cores e a RAM do host (sem swap) e derrubava os
    # vizinhos. Pico visto: 4,7 GiB e 280% de CPU. 3 cpus deixam 1 core para o resto; o shm de 64 MiB do Docker é
    # pouco para browser e teste pesado; 4096 processos barram uma fork bomb sem atrapalhar a pytest em paralelo
    mem_limit: ${OUTE_AGENT_MEM:-10g}
    cpus: ${OUTE_AGENT_CPUS:-3}
    shm_size: ${OUTE_AGENT_SHM:-2g}
    pids_limit: ${OUTE_AGENT_PIDS:-4096}
    tty: true
    stdin_open: true

  ai-memory:
    # mesma versão do cliente embutido na imagem do agent (Dockerfile ARG AI_MEMORY_VERSION)
    image: akitaonrails/ai-memory:${OUTE_AI_MEMORY_VERSION:-2.5.2}
    container_name: oute-ai-memory
    logging: *logging
    restart: unless-stopped
    # uso de 120 a 260 MiB (#570)
    mem_limit: ${OUTE_AI_MEMORY_MEM:-512m}
    cpus: ${OUTE_AI_MEMORY_CPUS:-1}
    # mesmo uid do agent (10001, fixo na imagem): o volume oute-memory é compartilhado (/data aqui, /data/ai-memory lá)
    user: "10001:10001"
    command: ["serve", "--transport", "http", "--bind", "0.0.0.0:49374", "--enable-web"]
    environment:
      # o servidor rejeita Host: fora desta lista; "ai-memory" é o nome DNS na rede oute
      AI_MEMORY_ALLOWED_HOSTS: "localhost,127.0.0.1,::1,ai-memory,oute-ai-memory"
      # escopo das chamadas MCP sem workspace/project: por sessão (Claude manda o id via bridge session-aware);
      # cliente sem id (Codex) cai no slot compartilhado, como antes — por isso as notas pedem escopo explícito
      AI_MEMORY_AUTO_SCOPE__MODE: per_session
      AI_MEMORY_AUTH_TOKEN: ${AI_MEMORY_AUTH_TOKEN:-}
      AI_MEMORY_LLM_PROVIDER: ${AI_MEMORY_LLM_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # #459 (ADR-08, adendo): o ai-memory só fala com o OpenRouter pelo llm-proxy, que põe a chave da memória e emite o
      # consumo. Sem chave aqui (ela é só do proxy); o LLM segue desligado até a #460.
      AI_MEMORY_LLM_BASE_URL: ${AI_MEMORY_LLM_BASE_URL:-http://llm-proxy:8440/api/v1}
    volumes:
      - oute-memory:/data
    depends_on:
      volume-init:
        condition: service_completed_successfully
    # #564 (ADR-08, adendo): sem saída à internet, por construção. Só redes `internal` (sem rota para fora do compose):
    # memoria = o agent alcança o ai-memory; llm = o ai-memory alcança o llm-proxy (e o collector). Nunca a rede oute
    # nem a saida, que têm rota para fora. O que o ai-memory baixava da internet: docs/adr/0008-agent-studio.md.
    networks: [memoria, llm]

  llm-proxy:
    # #459, ADR-08 (adendo): proxy do LLM do ai-memory ao OpenRouter. Repassa a chamada com a chave da memória
    # (OPENROUTER_MEMORY_API_KEY, pasta oute-services: só este serviço a recebe), lê o `usage` e manda o consumo ao
    # collector (agente ai-memory). Nos dois hosts, quando o `oute up` acha a chave no services.env (profile llm-proxy).
    # Mesma imagem do agent, outro comando; python3 stdlib.
    profiles: [llm-proxy]
    image: ghcr.io/renatobardi/oute-agent:${OUTE_VERSION:-latest}
    container_name: oute-llm-proxy
    logging: *logging
    restart: unless-stopped
    # python3 stdlib, uso de ~12 MiB (#570)
    mem_limit: ${OUTE_LLM_PROXY_MEM:-128m}
    cpus: ${OUTE_LLM_PROXY_CPUS:-0.5}
    user: "10001:10001"
    entrypoint: ["/usr/bin/python3", "/usr/local/bin/oute-llm-proxy"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      LLM_PROXY_API_KEY: ${OPENROUTER_MEMORY_API_KEY:-}
      LLM_PROXY_BIND: 0.0.0.0
      LLM_PROXY_PORT: "8440"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OUTE_HOST: ${OUTE_HOST:-oute}
      OUTE_INSTANCE: ${OUTE_INSTANCE:-oute-agent}
    # sem porta publicada: só o ai-memory, pela rede llm
    healthcheck:
      test: ["CMD", "/usr/bin/python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8440/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      otel-collector:
        condition: service_started
    # #459: rede llm, que o agent (yolo) não enxerga: ele não alcança o proxy, que usa a chave da memória. Fala com o
    # ai-memory e com o collector pela llm (interna) e sai à internet (OpenRouter) pela saida, a única rede com rota
    # para fora que o ai-memory não tem (#564).
    networks: [llm, saida]

  volume-init:
    # lab#181: migração one-shot do uid antigo (1001 = ubuntu do host) para o 10001 do container.
    # Só troca o dono quando a raiz do volume ainda não é 10001; nas próximas subidas não faz nada.
    image: ghcr.io/renatobardi/oute-agent:${OUTE_VERSION:-latest}
    container_name: oute-volume-init
    logging: *logging
    user: "0:0"
    network_mode: none
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for d in /v/*; do
          [ "$$(stat -c %u:%g "$$d")" = 10001:10001 ] && continue
          echo "volume-init: chown 10001:10001 $$d (era $$(stat -c %u:%g "$$d"))"
          chown -R 10001:10001 "$$d"
        done
    volumes:
      - oute-workspace:/v/workspace
      - oute-home:/v/home
      - oute-memory:/v/memory
      # fila em disco do collector (#161): a imagem roda como 10001:10001
      - oute-otel-queue:/v/otel-queue
      # RocksDB do SurrealDB (#187, só no oute-server; nos outros hosts o volume fica vazio): a imagem roda como nonroot
      - ${OUTE_SURREALDB_DIR:-oute-surrealdb}:/v/surrealdb

  agent-studio:
    # ADR-08 (#185): recebe OTLP/HTTP JSON do collector de cada host e grava no DuckDB (dedupe; 2xx só depois do
    # commit). Só no host com OUTE_AGENT_STUDIO=1 no .env (o oute-server): o `oute up` liga o profile quando o
    # services.env tem o item agent-studio do vault. No Mac não sobe. Mesma imagem do agent, outro comando; um
    # processo só (o DuckDB aceita um escritor só).
    profiles: [agent-studio]
    image: ghcr.io/renatobardi/oute-agent:${OUTE_VERSION:-latest}
    container_name: oute-agent-studio
    logging: *logging
    restart: unless-stopped
    user: "10001:10001"
    entrypoint: ["/opt/agent-studio/venv/bin/python", "-m", "agent_studio"]
    environment:
      # duas credenciais (#256, ADR-08 §6): ingestão (pasta oute-services do vault; só o collector manda com ela) e
      # leitura (pasta oute-agent; agente, tray e tela). Sem a de leitura, uma só para tudo (transição).
      AGENT_STUDIO_INGEST_TOKEN: ${AGENT_STUDIO_INGEST_TOKEN:-}
      AGENT_STUDIO_READ_TOKEN: ${AGENT_STUDIO_READ_TOKEN:-}
      # terceira credencial (#510, ADR-08 §6): a de marcação das ações da página da rodada (`POST /rodada/acao`). Pasta oute-services
      # do vault; só o agent-studio a recebe, nunca o agent. Sem ela (ou igual a uma das outras), a rota não existe.
      AGENT_STUDIO_MARK_TOKEN: ${AGENT_STUDIO_MARK_TOKEN:-}
      # nome de antes da #256: imagem antiga (até a release desta mudança) só conhece este; a nova ignora
      AGENT_STUDIO_TOKEN: ${AGENT_STUDIO_INGEST_TOKEN:-}
      AGENT_STUDIO_DB: /data/agent-studio/agent-studio.duckdb
      AGENT_STUDIO_PORT: "8430"
      PYTHONPATH: /opt/agent-studio/app
      # config (#203: preços do custo estimado; #204: hosts e limites), montada só leitura logo abaixo
      AGENT_STUDIO_CONFIG: /etc/oute/agent-studio/config.toml
      # conferência diária dos preços (#339, ADR-08): única chamada do agent-studio à internet, `GET https://` sem
      # credencial a models.dev e OpenRouter (duas URLs fixas no código). A tabela do seletor lista os modelos a conferir.
      AGENT_STUDIO_PRICE_CHECK: "1"
      # o tray e os alertas valem por 5 s (#570): o tray de cada Mac, a barra de alertas de cada tela e o /v1/alerts pediam a
      # mesma conta ao mesmo tempo; uma chamada só a refaz. 0 = sempre refaz
      AGENT_STUDIO_READ_TTL_S: "5"
      AGENT_STUDIO_SELECT_TABLE: /etc/oute/select/models.toml
      # estado derivado (#187): o SurrealDB pela rede studio (#256); os dois bancos juntos ou nenhum (503)
      AGENT_STUDIO_SURREAL_URL: http://surrealdb:8000
      AGENT_STUDIO_SURREAL_PASS: ${AGENT_STUDIO_SURREAL_PASS:-}
      # telemetria própria (#188): logs (só avisos, com teto) e métricas pelo SDK OTel ao collector local, com a
      # origem de sempre (ADR-04) e service.name próprio; sem oute.agent (não é agente)
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: agent-studio
      OTEL_RESOURCE_ATTRIBUTES: host.name=${OUTE_HOST:-oute},oute.instance=${OUTE_INSTANCE:-oute-agent},deployment.environment=${OUTE_HOST:-oute}
      # 5 min (#570): as métricas do próprio agent-studio eram 10% das linhas de métricas do banco
      OTEL_METRIC_EXPORT_INTERVAL: "300000"
    ports:
      # só loopback, nunca 0.0.0.0: o Mac chega pelo vhost agent-studio.oute.pro na tailnet (nginx, repo lab)
      - "127.0.0.1:${OUTE_AGENT_STUDIO_PORT:-8430}:8430"
    mem_limit: ${OUTE_AGENT_STUDIO_MEM:-6g}
    # 2 cores: se a gravação travar de novo, ele não ocupa os 4 (usou 230% de CPU em 2026-10-05; #570)
    cpus: ${OUTE_AGENT_STUDIO_CPUS:-2}
    volumes:
      # DuckDB (o volume nasce com o dono 10001 da pasta na imagem)
      # o DuckDB guarda tudo, sem retenção (#570): no oute-server fica numa pasta do disco de dados
      # (OUTE_AGENT_STUDIO_DIR no .env; o `oute up` confere que ela existe e é do usuário do container). Sem a variável,
      # volume docker
      - ${OUTE_AGENT_STUDIO_DIR:-oute-agent-studio}:/data/agent-studio
      # pasta, não arquivo: o `git pull` troca o arquivo e o `oute down/up` pega o novo, sem release
      - ./config/agent-studio:/etc/oute/agent-studio:ro
      # tabela do seletor (ADR-02), só leitura: os modelos que a conferência de preços (#339) sempre confere
      - ./config/select:/etc/oute/select:ro
    healthcheck:
      test: ["CMD", "/opt/agent-studio/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8430/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      surrealdb:
        condition: service_healthy
    # oute: o collector local e o agent chegam aqui; studio: só para falar com o SurrealDB (#256)
    networks: [oute, studio]

  surrealdb:
    # ADR-08 (#187): estado derivado (rodadas, workers, sessões, pedidos, conversas), consultado pelo tray e pela
    # tela; pode ser remontado a partir do DuckDB ou do bucket. Só no oute-server (mesmo profile do agent-studio).
    # Fixado por digest (= v3.3.0, multi-arch). Upgrade é deliberado: troca aqui + tests/lib/surreal.sh.
    profiles: [agent-studio]
    image: ${OUTE_SURREALDB_IMAGE:-surrealdb/surrealdb:v3.3.0@sha256:681c6c22c287421b5c7d99e0fde79b6e0d32c36c1ddeaab2762a1661cb04cd20}
    container_name: oute-surrealdb
    logging: *logging
    restart: unless-stopped
    user: "10001:10001"
    # RocksDB (recomendado em nó único; sync=every é o padrão). Autenticação ligada: root com a senha do vault.
    command: ["start", "--no-banner", "--log", "info", "--bind", "0.0.0.0:8000", "rocksdb:///data/surrealdb"]
    environment:
      SURREAL_USER: root
      SURREAL_PASS: ${AGENT_STUDIO_SURREAL_PASS:-}
    # obrigatório: sem limite, o cache do RocksDB mede pela RAM do host (~metade dela, #139)
    mem_limit: ${OUTE_SURREALDB_MEM:-2g}
    cpus: ${OUTE_SURREALDB_CPUS:-1}
    # sem porta publicada: só o agent-studio, pela rede studio
    volumes:
      # mesma regra do DuckDB (#570): OUTE_SURREALDB_DIR no .env = pasta do disco de dados; sem ela, volume docker
      - ${OUTE_SURREALDB_DIR:-oute-surrealdb}:/data/surrealdb
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://127.0.0.1:8000"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      volume-init:
        condition: service_completed_successfully
    # #256: fora da rede oute. O agent (yolo) não resolve nem alcança surrealdb:8000; só o agent-studio está nas duas
    networks: [studio]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OUTE_OTELCOL_VERSION:-0.161.0}
    container_name: oute-otel-collector
    logging: *logging
    restart: unless-stopped
    # parada limpa com o OCI lento (PUT de até 30 s, #137 C4); se estourar, o SIGKILL não perde nada (fila em disco)
    stop_grace_period: 30s
    # teto acima do memory_limiter (512 MiB, config/otel/collector.yaml): ele recusa dado antes de o kernel matar (#570)
    mem_limit: ${OUTE_OTELCOL_MEM:-768m}
    cpus: ${OUTE_OTELCOL_CPUS:-1}
    # sem porta publicada: só a rede "oute" enxerga (4317 gRPC, 4318 HTTP). Broadcast externo = fase 2, via vhost nginx.
    command:
      - --config=/etc/otelcol/collector.yaml
      # agent-studio (#189, #190): o `oute up` põe agent-studio quando há o token (rede docker no host que o roda, vhost
      # da tailnet nos outros); sem o token, none
      - --config=/etc/otelcol/${OUTE_OTEL_STUDIO:-none}.yaml
    environment:
      # origem de tudo que passa pelo collector: host.name / oute.instance (+ partição host=/instance= no bucket)
      OUTE_HOST: ${OUTE_HOST:-oute}
      OUTE_INSTANCE: ${OUTE_INSTANCE:-oute-agent}
      # credencial S3 do item oci-storage (usuário de serviço só nos buckets do oute-agent)
      AWS_ACCESS_KEY_ID: ${OCI_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${OCI_S3_SECRET_KEY:-}
      OCI_S3_REGION: ${OCI_S3_REGION:-sa-saopaulo-1}
      OCI_S3_ENDPOINT: ${OCI_S3_ENDPOINT:-}
      # SDK AWS v2 (2025+) manda checksum CRC32 com "aws-chunked" por padrão; OCI responde 501 NotImplemented.
      # when_required = só calcula checksum quando a operação exige (comportamento antigo, compatível com S3-compat).
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      # credencial de ingestão do agent-studio (item agent-studio da pasta oute-services do vault, #256), só com o
      # pipeline do agent-studio ligado
      AGENT_STUDIO_INGEST_TOKEN: ${AGENT_STUDIO_INGEST_TOKEN:-}
      # destino do pipeline do agent-studio, escolhido pelo `oute up` por host (#190)
      AGENT_STUDIO_URL: ${AGENT_STUDIO_URL:-http://agent-studio:8430}
    volumes:
      - ./config/otel:/etc/otelcol:ro
      # fila em disco dos exporters do bucket (#161) e do agent-studio (#189): sobrevive a oute down/up e a kill -9
      - oute-otel-queue:/var/lib/otelcol/queue
    depends_on:
      volume-init:
        condition: service_completed_successfully
    # llm: para o llm-proxy entregar o consumo do ai-memory (#459)
    networks: [oute, llm]

secrets:
  agent_env:
    # `export K='v'` da pasta oute-agent do vault, gerado pelo `oute up` no host (0600). Nada de sessão/API key do bw,
    # nem segredo de serviço (pasta oute-services -> ~/.oute/services.env, que nenhum container monta, #256).
    file: ${OUTE_AGENT_ENV_FILE:-~/.oute/agent.env}

volumes:
  oute-workspace:
  oute-home:
  oute-memory:
  oute-shared:
  oute-otel-queue:
  oute-agent-studio:
  oute-surrealdb:

networks:
  oute:
    driver: bridge
    # subnet fixa (lab#178): o sshd do host restringe o oute-ops ao IP do agent
    ipam:
      config:
        - subnet: ${OUTE_NET_SUBNET:-172.19.0.0/16}
          gateway: ${OUTE_NET_GATEWAY:-172.19.0.1}
          ip_range: ${OUTE_NET_IP_RANGE:-172.19.128.0/17}
  # #256: rede só do agent-studio com o SurrealDB. internal = sem saída e sem rota a partir do host; o agent não
  # está nela. Só é criada no host com o profile agent-studio.
  studio:
    driver: bridge
    internal: true
  # #564: agent e ai-memory. internal = sem rota para fora do compose: o ai-memory fica sem saída à internet, e o agent
  # continua saindo pela rede oute.
  memoria:
    driver: bridge
    internal: true
  # #459, #564: rede do llm-proxy com o ai-memory e o collector. internal: o ai-memory está nela e não pode ter saída.
  # O agent não está nela, então não alcança o proxy nem a chave da memória.
  llm:
    driver: bridge
    internal: true
  # #564: a saída do llm-proxy ao OpenRouter. Só ele está nela (nem o ai-memory, nem o agent).
  saida:
    driver: bridge
