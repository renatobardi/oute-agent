# OTel Collector do oute-agent (issue #13, ADR-04) — porta de entrada única de telemetria.
# Fontes (rede docker "oute", sem porta publicada): Claude Code, Codex, jev-router (LiteLLM).
# Destino 1 (sempre): bucket OCI oute-observability via API S3 — TUDO, inclusive conteúdo de prompt.
# Destino 2 (opcional, langfuse.yaml): Langfuse Cloud — só traces, só metadados (allowlist).
# Sem perda no bucket (#161, #152): fila em disco por exporter, lote formado na fila (não em memória),
# retry sem prazo. kill -9 ou OCI fora por dias não perdem o que o collector aceitou (tests/otelcol-queue.test.sh).
# Métricas do próprio collector no pipeline metrics (#162, tests/otelcol-metrics.test.sh).
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  # volume nomeado oute-otel-queue (dono 10001 = USER da imagem, via volume-init); sobrevive a oute down/up.
  # O bbolt chega a ~1,7× o queue_size e não encolhe (#137): 1 GB de fila ≈ 2 GB de disco.
  file_storage/queue:
    directory: /var/lib/otelcol/queue
    create_directory: true   # o volume já traz o diretório; isto deixa o `validate` passar fora do container

receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
    spike_limit_mib: 64
  resource:
    attributes:
      - {key: service.namespace, value: oute-agent, action: upsert}
      # origem = máquina + instância (#22: a instância só precisa ser única dentro da máquina)
      - {key: host.name, value: "${env:OUTE_HOST}", action: upsert}
      - {key: oute.instance, value: "${env:OUTE_INSTANCE}", action: upsert}
      - {key: deployment.environment, value: "${env:OUTE_HOST}", action: upsert}
  # oute.agent = qual agente gerou a telemetria (claude | codex | router); nos spans do jev-router o hook
  # já grava o cliente real (pi, …) em span.attributes["oute.agent"], que tem precedência
  transform/agent:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements: &agent_by_service
          - set(resource.attributes["oute.agent"], "claude") where resource.attributes["service.name"] == "claude-code"
          - set(resource.attributes["oute.agent"], "codex") where IsMatch(resource.attributes["service.name"], "(?i)^codex")
          - set(resource.attributes["oute.agent"], "router") where resource.attributes["service.name"] == "jev-router"
      - context: span
        statements:
          - set(span.attributes["oute.agent"], resource.attributes["oute.agent"]) where span.attributes["oute.agent"] == nil
    log_statements:
      - context: resource
        statements: *agent_by_service
    metric_statements:
      - context: resource
        statements: *agent_by_service

exporters:
  awss3/traces:
    s3uploader:
      region: "${env:OCI_S3_REGION}"
      endpoint: "${env:OCI_S3_ENDPOINT}"
      s3_force_path_style: true
      s3_bucket: oute-observability
      s3_prefix: "otel/traces/host=${env:OUTE_HOST}/instance=${env:OUTE_INSTANCE}"
      s3_partition_format: "year=%Y/month=%m/day=%d/hour=%H"
      s3_partition_timezone: UTC
      compression: gzip
    marshaler: otlp_json
    timeout: 30s
    # OCI fora: retenta para sempre (400 também é retentado, #137 C8); o limite é o tamanho da fila
    retry_on_failure: &retry_forever {enabled: true, max_elapsed_time: 0}
    # 1 GB do bucket dividido entre os três (logs 600 / traces 300 / metrics 100 MB). Fila cheia = 503 para a fonte (retentável).
    sending_queue:
      enabled: true
      storage: file_storage/queue
      sizer: bytes
      queue_size: 314572800  # 300 MB
      block_on_overflow: false
      # lote na fila: poucos objetos/requests no OCI (franquia 50 mil/mês)
      batch: &archive_batch {flush_timeout: 5m, sizer: items, min_size: 20000, max_size: 50000}
  awss3/metrics:
    s3uploader:
      region: "${env:OCI_S3_REGION}"
      endpoint: "${env:OCI_S3_ENDPOINT}"
      s3_force_path_style: true
      s3_bucket: oute-observability
      s3_prefix: "otel/metrics/host=${env:OUTE_HOST}/instance=${env:OUTE_INSTANCE}"
      s3_partition_format: "year=%Y/month=%m/day=%d/hour=%H"
      s3_partition_timezone: UTC
      compression: gzip
    marshaler: otlp_json
    timeout: 30s
    retry_on_failure: *retry_forever
    sending_queue:
      enabled: true
      storage: file_storage/queue
      sizer: bytes
      queue_size: 104857600  # 100 MB
      block_on_overflow: false
      batch: *archive_batch
  awss3/logs:
    s3uploader:
      region: "${env:OCI_S3_REGION}"
      endpoint: "${env:OCI_S3_ENDPOINT}"
      s3_force_path_style: true
      s3_bucket: oute-observability
      s3_prefix: "otel/logs/host=${env:OUTE_HOST}/instance=${env:OUTE_INSTANCE}"
      s3_partition_format: "year=%Y/month=%m/day=%d/hour=%H"
      s3_partition_timezone: UTC
      compression: gzip
    marshaler: otlp_json
    timeout: 30s
    retry_on_failure: *retry_forever
    sending_queue:
      enabled: true
      storage: file_storage/queue
      sizer: bytes
      queue_size: 629145600  # 600 MB
      block_on_overflow: false
      batch: *archive_batch

service:
  extensions: [health_check, file_storage/queue]
  telemetry:
    logs: {level: warn}
    # métricas do próprio collector (#162): fila (tamanho, capacidade), envio que falhou, dado recusado, por exporter
    # e receiver. Saem via OTLP para o receiver do próprio collector (loopback, sem porta nova) e seguem pelo
    # metrics/archive até o bucket, como qualquer métrica. Com `readers` o Prometheus :8888 padrão não sobe.
    # Fonte do alerta de fila > 50% e de recusa (#136); a linha de log "Dropping data" não serve (#137).
    # Com retry sem prazo, send_failed_* só sobe quando um envio é abandonado (na parada, e aí nem chega ao bucket);
    # OCI fora aparece como queue_size subindo e sent_* parado. Na parada, o último envio do reader acha o receiver fechado: loga erro e sai com 1, depois
    # de a fila já ter fechado (nada se perde).
    metrics:
      level: basic
      readers:
        - periodic:
            interval: 60000
            exporter:
              otlp: {protocol: http/protobuf, endpoint: "http://127.0.0.1:4318/v1/metrics"}
  pipelines:
    traces/archive:
      receivers: [otlp]
      processors: [memory_limiter, transform/agent, resource]
      exporters: [awss3/traces]
    metrics/archive:
      receivers: [otlp]
      processors: [memory_limiter, transform/agent, resource]
      exporters: [awss3/metrics]
    logs/archive:
      receivers: [otlp]
      processors: [memory_limiter, transform/agent, resource]
      exporters: [awss3/logs]
