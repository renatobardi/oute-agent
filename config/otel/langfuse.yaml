# Pipeline extra: traces -> Langfuse Cloud SÓ COM METADADOS (ADR-04, opção híbrida).
# Mesclado sobre collector.yaml quando o vault tem o item "langfuse" (oute up decide).
# Privacidade por padrão: ALLOWLIST de atributos (o que não está aqui não sai) + span events descartados.
processors:
  filter/no_events:
    error_mode: ignore
    traces:
      # spans internos do LiteLLM = ruído no painel (continuam no bucket)
      span:
        - 'IsMatch(name, "^(auth|router|self|proxy_pre_call|raw_gen_ai_request|batch_write_to_db|redis|postgres)$")'
        # Codex: allowlist de spans (1 exec gerava ~7 traces + milhares de fs.*/append_items/thread/*).
        # Fica só o esqueleto útil: sessão -> turno -> amostragem -> tool/hook. Resto segue no bucket.
        - >-
          IsMatch(resource.attributes["service.name"], "(?i)codex") and
          not IsMatch(name, "^(codex\\.exec|session_init|session_loop|session_task\\.turn|run_sampling_request|dispatch_tool_call_with_state|codex\\.hooks\\.command|thread/start|turn/start)$")
      # span events só do Codex (é onde ele põe modelo/tools); os demais descartados
      spanevent:
        - 'not IsMatch(resource.attributes["service.name"], "(?i)codex")'
  transform/metadata_only:
    error_mode: ignore
    trace_statements:
      # uso -> convenção que o Langfuse soma (gen_ai.usage.*); roda ANTES da allowlist
      - context: span
        statements:
          # Claude Code (claude_code.llm_request): input_tokens já exclui cache (semântica Anthropic)
          - set(span.attributes["gen_ai.usage.input_tokens"], span.attributes["input_tokens"]) where span.attributes["input_tokens"] != nil
          - set(span.attributes["gen_ai.usage.output_tokens"], span.attributes["output_tokens"]) where span.attributes["output_tokens"] != nil
          - set(span.attributes["gen_ai.usage.cache_read_input_tokens"], span.attributes["cache_read_tokens"]) where span.attributes["cache_read_tokens"] != nil
          - set(span.attributes["gen_ai.usage.cache_creation_input_tokens"], span.attributes["cache_creation_tokens"]) where span.attributes["cache_creation_tokens"] != nil
          # Codex (session_task.turn): input = não-cacheado, cache à parte (sem contar duas vezes)
          - set(span.attributes["gen_ai.usage.input_tokens"], span.attributes["codex.turn.token_usage.non_cached_input_tokens"]) where span.attributes["codex.turn.token_usage.non_cached_input_tokens"] != nil
          - set(span.attributes["gen_ai.usage.output_tokens"], span.attributes["codex.turn.token_usage.output_tokens"]) where span.attributes["codex.turn.token_usage.output_tokens"] != nil
          - set(span.attributes["gen_ai.usage.cache_read_input_tokens"], span.attributes["codex.turn.token_usage.cached_input_tokens"]) where span.attributes["codex.turn.token_usage.cached_input_tokens"] != nil
          - set(span.attributes["gen_ai.request.model"], span.attributes["model"]) where span.name == "session_task.turn" and span.attributes["model"] != nil
          - set(span.attributes["langfuse.observation.type"], "generation") where span.name == "session_task.turn"
          # agente (claude | codex | pi | …) -> metadata do trace, filtrável no Langfuse
          - set(span.attributes["langfuse.trace.metadata.agent"], span.attributes["oute.agent"]) where span.attributes["oute.agent"] != nil
          # aba Sessions do Langfuse
          - set(span.attributes["langfuse.session.id"], span.attributes["session.id"]) where span.attributes["session.id"] != nil
      - context: span
        statements:
          - >-
            keep_matching_keys(span.attributes,
            "^(gen_ai\\.(system|provider\\.name|operation\\.name|request\\.model|response\\.model|response\\.id|response\\.finish_reasons|usage\\..*)|llm\\.(model_name|token_count\\..*)|langfuse\\.(trace\\.name|trace\\.tags|trace\\.metadata\\.agent|session\\.id|user\\.id|observation\\.(type|level|model\\.name|usage_details|cost_details))|session\\.id|user\\.id|metadata\\.oute_router.*|oute\\..*|model|cost_usd|duration_ms|.*_tokens|tool_name|success|decision|status_code|error\\.type)$")
      # eventos que sobraram (Codex): mesma lógica de allowlist — prompt/resposta nunca saem
      - context: spanevent
        statements:
          - >-
            keep_matching_keys(spanevent.attributes,
            "^(event\\.name|event\\.kind|model|slug|provider|tool_name|call_id|duration_ms|success|decision|status|attempt|http\\.response\\.status_code|conversation\\.id|.*_tokens|.*token_count|.*_count)$")
      - context: resource
        statements:
          - keep_matching_keys(resource.attributes, "^(service\\.(name|namespace|version)|host\\.name|deployment\\.environment|oute\\.agent)$")
  batch/fast:
    timeout: 10s

exporters:
  otlphttp/langfuse:
    endpoint: "${env:LANGFUSE_HOST}/api/public/otel"
    headers:
      Authorization: "Basic ${env:OUTE_LANGFUSE_AUTH}"
      x-langfuse-ingestion-version: "4"
    compression: gzip

service:
  pipelines:
    traces/langfuse:
      receivers: [otlp]
      processors: [memory_limiter, transform/agent, filter/no_events, transform/metadata_only, resource, batch/fast]
      exporters: [otlphttp/langfuse]
