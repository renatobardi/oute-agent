# Tabela de fase do seletor de modelo (ADR-02, #219): fase do AI-DLC → modelo Claude e modelo/esforço do Codex.
# Lida pelo `oute-select` a cada abertura de sessão (`oute-task`, `oute-swarm spawn`); montada só leitura no `agent`
# em /opt/oute/select. Mudança entra com `git pull` + `oute down/up`, sem release.
#
# Ids exatos, sem alias (`opus`, `sonnet`): trocar de versão é uma mudança visível aqui. Todo id precisa existir no
# CLI instalado (#220). A coluna do Codex abre com `--agent codex` e na reserva (#258): sem `--agent`/`--model`/`--phase`, com o Claude indisponível (`claude auth status` ≠ 0), a sessão abre no Codex da mesma linha.
#
# Precedência: --agent/--model > exceção por label > label aidlc:<fase> > [default].

# Nada decidiu (sem issue, issue sem label de fase, `gh` fora do ar): Sonnet, com aviso.
[default]
claude = "claude-sonnet-5-5"
codex = "gpt-6.1-sol"
effort = "high"

# Uma linha por grupo de fases. Só fases do ADR-07 (e a faixa `ctx`) são chave.
[[line]]
phases = ["strat", "intent", "arch", "spec"]
claude = "claude-opus-5-5"
codex = "gpt-6-astra"
effort = "high"

[[line]]
phases = ["build", "qa", "design", "plan", "ship", "iter"]
claude = "claude-sonnet-5-5"
codex = "gpt-6.1-sol"
effort = "high"

[[line]]
phases = ["ops", "ctx", "learn"]
claude = "claude-haiku-4-5-20251001"
codex = "gpt-6-luna"
effort = "medium"

# Exceções por label de tipo, antes da fase, na ordem em que aparecem aqui (precedência).
[[exception]]
label = "spike"
claude = "claude-sonnet-5-5"
codex = "gpt-6.1-sol"
effort = "high"

# `kaizen` não vale com label de fase que mexe em código (#409): vale a fase.
[[exception]]
label = "kaizen"
unless_phases = ["build", "qa", "design", "plan", "ship", "iter"]
claude = "claude-haiku-4-5-20251001"
codex = "gpt-6-luna"
effort = "medium"

[[exception]]
label = "docs"
claude = "claude-haiku-4-5-20251001"
codex = "gpt-6-luna"
effort = "medium"

# Revisor das etapas da rodada (#507, ADR-08, "Página da rodada e do ciclo"): o par de quem escreve × quem revisa.
# Lido pelo `oute-swarm step review`, que recebe o modelo do autor em `--writer`. O revisor é sempre de outro modelo que
# o autor (o `models-check` recusa linha com o autor na própria lista) e roda em modo headless, por `claude -p`: só
# `agent = "claude"` vale (o `models-check` recusa "codex", que herdaria o ~/.codex sem isolamento conferido; o `effort`
# fica na linha por forma e não é usado). Autor sem linha aqui, ou linha com agente que não é o claude, = etapa `sem-revisor`.
# Quem escreve em Sonnet é revisado por Opus, e o inverso (recomendação do autor da proposta da #489).
[[reviewer]]
writers = ["claude-sonnet-5-5", "gpt-6.1-sol"]
agent = "claude"
model = "claude-opus-5-5"
effort = "high"

[[reviewer]]
writers = ["claude-opus-5-5", "gpt-6-astra"]
agent = "claude"
model = "claude-sonnet-5-5"
effort = "high"
