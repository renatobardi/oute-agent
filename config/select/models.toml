# Tabela de fase do seletor de modelo (ADR-02, #219): fase do AI-DLC → modelo Claude e modelo/esforço do Codex.
# Lida pelo `oute-select` a cada abertura de sessão (`oute-task`, `oute-swarm spawn`); montada só leitura no `agent`
# em /opt/oute/select. Mudança entra com `git pull` + `oute down/up`, sem release.
#
# Ids exatos, sem alias (`opus`, `sonnet`): trocar de versão é uma mudança visível aqui. Todo id precisa existir no
# CLI instalado (#220). A coluna de cada assinatura abre com `--agent <nome>` e na reserva (#258, #598): sem `--agent`/`--model`/`--phase`, com a padrão indisponível ou no teto de cota, a sessão abre na reserva, na mesma linha.
#
# Precedência: --agent/--model > exceção por label > label aidlc:<fase> > [default].

# Assinaturas (#598, ADR-02): uma é a padrão (`default = true`, só uma); as outras são reservas. Toda linha de fase abaixo
# tem uma coluna por assinatura (`name`), conferida pelo `scripts/models-check`. `status` é o comando que sai 0 quando o
# agente está logado; `effort = true` = a assinatura usa o esforço da linha (hoje só o Codex); `prefixes` = começos de id de
# modelo que identificam a assinatura num `--model` fora da tabela. A cota de cada uma vem do `oute-quota --json`.
# `weekly_guard_pct` (#742, opcional, número de 1 a 100) = a trava semanal: o `oute-swarm spawn` não abre sessão nessa assinatura
# com a janela de 7 dias nesse valor ou acima (código 5; `--force` vence). O seletor continua sem recusar; a trava é do spawn.
# `agent` (#677) = o programa que a sessão roda; sem ele vale o `name`. A `zai` é o próprio `claude` falando com a API
# compatível da Z.ai (ADR-02, adendo de 2026-10-05): `--agent claude` e `--subscription zai` são coisas diferentes.
[[subscription]]
name = "claude"
default = true
weekly_guard_pct = 85
status = ["claude", "auth", "status"]

[[subscription]]
name = "zai"
agent = "claude"
status = ["oute-quota", "--available", "zai"]
prefixes = ["glm-"]

[[subscription]]
name = "codex"
status = ["codex", "login", "status"]
effort = true
prefixes = ["gpt-", "codex"]

# Como escolher a reserva quando a padrão está indisponível ou no teto de cota (98%, #558): `mais-livre` = a reserva com mais
# cota livre (100 − a janela mais cheia dela); `ordem` = a primeira reserva abaixo do teto, na ordem das [[subscription]].
# Linha com `chain` (#677) = a cadeia dela, na ordem: a primeira é a padrão da linha (o `reserve_from`) e vale o modo `ordem`,
# só com as assinaturas da cadeia. Raciocínio: claude → zai → codex. Execução: zai → claude → codex (ADR-02, 2026-10-06).
# Linha sem `chain` segue a padrão da tabela e o `reserve_mode` acima.
[select]
reserve_mode = "mais-livre"

# Nada decidiu (sem issue, issue sem label de fase, `gh` fora do ar): Sonnet, com aviso.
[default]
claude = "claude-sonnet-5-5"
zai = "glm-5.3"
codex = "gpt-6.1-sol"
effort = "high"

# Uma linha por grupo de fases. Só fases do ADR-07 (e a faixa `ctx`) são chave.
# Raciocínio:
[[line]]
phases = ["strat", "intent", "arch", "spec"]
chain = ["claude", "zai", "codex"]
claude = "claude-opus-5-5"
zai = "glm-5.3"
codex = "gpt-6-astra"
effort = "high"

[[line]]
phases = ["design", "plan", "qa", "iter"]
chain = ["claude", "zai", "codex"]
claude = "claude-sonnet-5-5"
zai = "glm-5.3"
codex = "gpt-6.1-sol"
effort = "high"

[[line]]
phases = ["learn"]
chain = ["claude", "zai", "codex"]
claude = "claude-sonnet-5-5"
zai = "glm-5.3"
codex = "gpt-6-luna"
effort = "medium"

# Execução:
[[line]]
phases = ["build", "ship"]
chain = ["zai", "claude", "codex"]
claude = "claude-sonnet-5-5"
zai = "glm-5.3"
codex = "gpt-6.1-sol"
effort = "high"

[[line]]
phases = ["ops", "ctx"]
chain = ["zai", "claude", "codex"]
claude = "claude-sonnet-5-5"
zai = "glm-5.3"
codex = "gpt-6-luna"
effort = "medium"

# Exceções por label de tipo, antes da fase, na ordem em que aparecem aqui (precedência).
[[exception]]
label = "spike"
chain = ["claude", "zai", "codex"]
claude = "claude-sonnet-5-5"
zai = "glm-5.3"
codex = "gpt-6.1-sol"
effort = "high"

# `kaizen` não vale com label de fase que mexe em código (#409): vale a fase.
[[exception]]
label = "kaizen"
unless_phases = ["build", "qa", "design", "plan", "ship", "iter"]
chain = ["zai", "claude", "codex"]
claude = "claude-sonnet-5-5"
zai = "glm-5.3"
codex = "gpt-6-luna"
effort = "medium"

[[exception]]
label = "docs"
chain = ["zai", "claude", "codex"]
claude = "claude-sonnet-5-5"
zai = "glm-5.3"
codex = "gpt-6-luna"
effort = "medium"

# Revisor das etapas da rodada (#507, ADR-08, "Página da rodada e do ciclo"): o par de quem escreve × quem revisa.
# Lido pelo `oute-swarm step review`, que recebe o modelo do autor em `--writer`. O revisor é sempre de outro modelo que
# o autor (o `models-check` recusa linha com o autor na própria lista) e roda em modo headless, por `claude -p`: só
# `agent = "claude"` vale (o `models-check` recusa "codex", que herdaria o ~/.codex sem isolamento conferido; o `effort`
# fica na linha por forma e não é usado). Autor sem linha aqui, ou linha com agente que não é o claude, = etapa `sem-revisor`.
# Quem escreve em Sonnet (ou em `glm-5.3`, da `zai`, #677) é revisado por Opus, e o inverso (recomendação do autor da proposta da #489).
[[reviewer]]
writers = ["claude-sonnet-5-5", "gpt-6.1-sol", "glm-5.3"]
agent = "claude"
model = "claude-opus-5-5"
effort = "high"

[[reviewer]]
writers = ["claude-opus-5-5", "gpt-6-astra"]
agent = "claude"
model = "claude-sonnet-5-5"
effort = "high"
