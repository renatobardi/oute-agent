# Config do agent-studio (ADR-08, #203). Montada só leitura no container (/etc/oute/agent-studio/config.toml):
# mudança entra com `git pull` + `oute down/up`, sem release. Preços (#203) e alertas (#204).

# Preço em USD por 1M tokens, usado só para o **custo estimado** das chamadas que chegam sem custo real (o Codex).
# O Claude Code manda o custo real, mas não no span: no log `api_request` de mesmo `request_id`, que o agent-studio
# junta na consulta (#157). O preço do Claude abaixo é só a reserva para a chamada que ficou sem esse log (marcada
# como estimada, nunca somada ao real). O `jev.decision` do roteador (registro histórico, até 2026-09-30) traz o real.
#   input          = entrada não cacheada        output         = saída
#   cache_read     = entrada lida do cache       cache_creation = escrita no cache
# `input` e `output` são obrigatórios; cache ausente = preço de `input` (estima para cima, nunca de graça).
# O nome é o modelo do span (sem diferenciar maiúsculas; `openai/gpt-5` também acha `gpt-5`).
# Modelo sem entrada aqui e sem preço no histórico = sem custo estimado (nunca zero): o `/v1/usage` lista esses
# modelos em `unpriced_models`.
#
# Papel deste arquivo (#339): **semente e trava manual**. O preço vigente mora no histórico do banco do studio
# (`GET /v1/prices`), e uma conferência diária (e uma na subida) o compara com models.dev e OpenRouter: quando as
# duas fontes concordam num valor novo, o histórico ganha uma linha com a hora da troca e o estimado passa a usar o
# preço novo para as chamadas dali em diante (a chamada antiga mantém o preço da época). Por isso:
#   - modelo novo aqui entra no histórico na próxima subida (a semente), e só nessa;
#   - editar o preço de um modelo que já tem histórico NÃO o muda: quem manda é o histórico (e a fonte);
#   - `fixed = true` na entrada trava o modelo: a fonte nunca o troca (a diferença só gera o alerta "preço fixo
#     difere da fonte") e o preço deste arquivo vale sempre (editar acrescenta uma linha de origem `config`).
# Modelos conferidos: os da tabela do seletor (`config/select/models.toml`) e todo modelo com chamada nos últimos
# 30 dias.
# Fonte dos `gpt-5*`: preços de lista da OpenAI (API, tier padrão). A reserva do ADR-02 (`gpt-6-*`) vem logo depois
# do bloco do Codex abaixo; o modelo que não estiver aqui continua em `unpriced_models`, nunca como zero.

[prices."gpt-5"]
input = 1.25
output = 10.0
cache_read = 0.125

[prices."gpt-5-codex"]
input = 1.25
output = 10.0
cache_read = 0.125

[prices."gpt-5.1"]
input = 1.25
output = 10.0
cache_read = 0.125

[prices."gpt-5.1-codex"]
input = 1.25
output = 10.0
cache_read = 0.125

[prices."gpt-5-mini"]
input = 0.25
output = 2.0
cache_read = 0.025

[prices."gpt-5.1-codex-mini"]
input = 0.25
output = 2.0
cache_read = 0.025

[prices."gpt-5-nano"]
input = 0.05
output = 0.4
cache_read = 0.005

