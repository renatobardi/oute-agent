# Política do roteador — FONTE editada à mão.
# `oute router-sync` (roda em todo `oute up` e diariamente via `oute schedule`) consulta o OpenRouter
# e GERA a partir daqui (arquivos não versionados):
#   config/litellm/router.yaml      perfis + lista de modelos de cada perfil (o que o hook usa)
#   config/litellm/config.yaml      model_list do LiteLLM
#   config/litellm/candidates.json  perfis pro models.json do Pi
#   config/litellm/catalog.json     todos os modelos elegíveis consultados (referência)
#
# Seleção em 2 etapas por request:
#   1) Jev (Decisions API) escolhe o PERFIL pela complexidade/tipo da tarefa;
#   2) OpenRouter escolhe o MODELO dentro do perfil: `models: [...]` (<= 3) + `provider.sort = {by, partition: none}`
#      -> ordena endpoints de todos os modelos ao vivo e faz fallback. `sort: null` = respeita a ordem (qualidade).

# Espelho do guardrail "oute-agent guardrail - core" (OpenRouter → Guardrails), atualizado 2026-09-23.
# Política: nada direto de criadores chineses/1st-party de terceiros; modelos abertos (Kimi, DeepSeek, GLM, Qwen,
# gpt-oss, Llama) vêm por hosts neutros (Fireworks, Together, DeepInfra, Baseten, Groq, Cerebras).
# O guardrail é quem manda (via /models/user, inclusive ZDR); esta lista só complementa o filtro local.
providers_allow:
  # hosts de inferência
  - groq
  - cerebras
  - fireworks
  - together
  - deepinfra
  - baseten
  # criadores que servem os próprios modelos
  - xai
  - z-ai
  - alibaba
  - mistral
  - minimax
  - xiaomi
  # roteador (Jev)
  - typesafe

# Sem variantes :free (decisão 2026-09-23): rate limit baixo quebra loop de agente e
# endpoints gratuitos costumam reter/treinar com prompts (que levam código do repo).
exclude_patterns:
  - "*:free"
  - "*:batch"          # endpoints de lote (assíncronos/lentos) — inúteis pra agente interativo

# Máximo de modelos por perfil. Limite do OpenRouter: `models` com no máximo 3 itens (HTTP 400 acima disso).
max_models_per_profile: 3

# Perfis. `prefer`: padrões (fnmatch) em ordem de preferência.
# Cada padrão contribui com NO MÁXIMO 1 modelo (o mais novo elegível) -> o perfil mistura famílias
# (fallback real entre modelos diferentes, não 3 versões do mesmo). Os 3 primeiros padrões com match vencem.
# Preferências do Bardi: GLM, Kimi, DeepSeek, Grok.
candidates:
  - name: reasoning
    desc: "Raciocínio profundo, arquitetura, refactors grandes, debugging difícil. Mais caro."
    requires: {tools: true}
    sort: null            # qualidade primeiro: ordem da lista
    # versões "cheias": [0-9] no fim exclui sufixos -flash/-flashx/-code/-air
    prefer: ["z-ai/glm-5.[0-9]", "moonshotai/kimi-k2.[0-9]", "deepseek/deepseek-v3.[0-9]", "x-ai/grok-4.[0-9]", "deepseek/deepseek-r1*", "qwen/qwen3-max*"]
  - name: coder
    desc: "Default para coding agentic: bom equilíbrio qualidade/custo/latência."
    requires: {tools: true}
    sort: throughput
    prefer: ["z-ai/glm-5.[0-9]", "moonshotai/kimi-k2*-code", "qwen/qwen3-coder-plus*", "deepseek/deepseek-v3.[0-9]", "z-ai/glm-4.6", "qwen/qwen3-coder"]
  - name: coder-fast
    desc: "Edits rápidos, boilerplate, testes, tarefas repetitivas. Barato e rápido."
    requires: {tools: true}
    sort: latency
    prefer: ["x-ai/grok-code-fast*", "openai/gpt-oss-120b", "mistralai/devstral*", "qwen/qwen3-coder-flash*", "z-ai/glm-4.5-air*"]
  - name: long-context
    desc: "Contexto muito longo: repositório inteiro, documentos grandes, sumarização."
    requires: {tools: true, min_context: 500000}
    sort: price
    prefer: ["x-ai/grok-4*fast*", "minimax/minimax-*", "qwen/qwen-plus*", "qwen/qwen3-coder-plus*"]
  - name: cheap
    desc: "Classificação, respostas curtas, extração simples. O mais barato possível."
    requires: {tools: true}
    sort: price
    prefer: ["openai/gpt-oss-20b", "mistralai/mistral-small*", "deepseek/deepseek-v3*", "meta-llama/llama-4-scout*", "mistralai/ministral*", "qwen/qwen3-[0-9]*b-a*b-instruct*"]
  - name: vision
    desc: "Entrada com imagem: screenshots, diagramas, UI."
    requires: {tools: true, vision: true}
    sort: price
    prefer: ["qwen/qwen3-vl*", "z-ai/glm-4.*v", "meta-llama/llama-4-maverick*", "mistralai/pixtral*", "x-ai/grok-4*"]

fallback: coder

# Modelo do próprio roteador (Decisions API). Validado com uma decisão real, não vira candidato.
router_model: typesafe/jev-1.13
