# LiteLLM proxy — jev-router
# Clientes usam model: "jev-router"; o hook consulta Jev (TypeSafe) e reescreve para o candidato escolhido.
model_list:
  - model_name: jev-router
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4.5   # placeholder; hook sobrescreve
      api_key: os.environ/OPENROUTER_API_KEY

  # candidatos (todos via OpenRouter)
  - model_name: claude-sonnet
    litellm_params: { model: openrouter/anthropic/claude-sonnet-4.5, api_key: os.environ/OPENROUTER_API_KEY }
  - model_name: claude-opus
    litellm_params: { model: openrouter/anthropic/claude-opus-4.1, api_key: os.environ/OPENROUTER_API_KEY }
  - model_name: gpt-5
    litellm_params: { model: openrouter/openai/gpt-5, api_key: os.environ/OPENROUTER_API_KEY }
  - model_name: gpt-5-mini
    litellm_params: { model: openrouter/openai/gpt-5-mini, api_key: os.environ/OPENROUTER_API_KEY }
  - model_name: gemini-pro
    litellm_params: { model: openrouter/google/gemini-2.5-pro, api_key: os.environ/OPENROUTER_API_KEY }
  - model_name: gemini-flash
    litellm_params: { model: openrouter/google/gemini-2.5-flash, api_key: os.environ/OPENROUTER_API_KEY }
  - model_name: qwen-coder
    litellm_params: { model: openrouter/qwen/qwen3-coder, api_key: os.environ/OPENROUTER_API_KEY }
  - model_name: deepseek
    litellm_params: { model: openrouter/deepseek/deepseek-v3.1, api_key: os.environ/OPENROUTER_API_KEY }
  - model_name: jev
    litellm_params: { model: openrouter/typesafe/jev-latest, api_key: os.environ/OPENROUTER_API_KEY }

litellm_settings:
  callbacks: jev_hook.handler
  drop_params: true
  num_retries: 2
  request_timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
