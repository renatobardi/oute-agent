# Imagem do oute-agent (issue #2): build nativo arm64 no GitHub + push no ghcr + retenção (#12).
# Dispara na tag vX.Y.Z (scripts/release) ou manual. Servidor só faz `oute pull` — não constrói mais.
name: image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm          # runner arm64 nativo (conta na franquia de minutos do plano)
    timeout-minutes: 45
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: scripts executáveis (#9)
        run: |
          bad="$(bash scripts/exec-files | while read -r f; do [[ "$(git ls-files -s -- "$f" | cut -d' ' -f1)" == 100755 ]] || echo "$f"; done)"
          [[ -z "$bad" ]] || { echo "::error::sem +x no git: $bad (rode ./scripts/fix-bridge)"; exit 1; }

      - id: v
        name: versão (VERSION; na tag, precisa bater)
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF_TYPE" == tag && "${GITHUB_REF_NAME#v}" != "$V" ]]; then
            echo "::error::tag $GITHUB_REF_NAME diferente de VERSION ($V)"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: |
            OUTE_VERSION=${{ steps.v.outputs.version }}
            OUTE_UID=${{ vars.OUTE_UID || '1001' }}
          tags: ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
          # cache de camadas no próprio ghcr, em pacote separado (a retenção do pacote da imagem não o apaga).
          # type=gha não serve: cache do Actions é por ref, e cada tag vX.Y.Z é um ref novo -> sempre miss.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-cache:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-cache:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      - name: resumo
        run: |
          IMG=ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
          SIZE=$(docker buildx imagetools inspect "$IMG" --format '{{json .Manifest}}' | jq '[.layers[]?.size] | add // 0')
          echo "### $IMG" >> "$GITHUB_STEP_SUMMARY"
          echo "tamanho comprimido: $(numfmt --to=iec "$SIZE")" >> "$GITHUB_STEP_SUMMARY"

  retention:
    # regra do projeto: só a versão corrente e a anterior no registry.
    # gh api direto: actions/delete-package-versions (v5, a última) ainda é Node 20 (#20).
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      PKG: oute-agent
      KEEP: 2
    steps:
      - name: apagar versões além das ${{ env.KEEP }} mais novas
        run: |
          set -euo pipefail
          base="/users/$OWNER/packages/container/$PKG/versions"
          gh api --paginate "$base" --jq '.[] | "\(.created_at) \(.id) \(.metadata.container.tags | join(","))"' | sort -r > versions.txt
          echo "versões no ghcr:"; cat versions.txt
          tail -n +"$((KEEP + 1))" versions.txt | while read -r _ id tags; do
            gh api -X DELETE "$base/$id" && echo "apagada $id (${tags:-sem tag})"
          done
