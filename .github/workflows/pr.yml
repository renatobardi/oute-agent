# CI de PR (#66): primeiro workflow disparado em pull_request. Só checks baratos, sem Docker e sem segredos.
name: pr

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: scripts executáveis (#9)
        run: |
          bad="$(bash scripts/exec-files | while read -r f; do [[ "$(git ls-files -s -- "$f" | cut -d' ' -f1)" == 100755 ]] || echo "$f"; done)"
          [[ -z "$bad" ]] || { echo "::error::sem +x no git: $bad (rode ./scripts/fix-bridge)"; exit 1; }

      # #89: todo tests/*.test.sh roda sem editar o workflow; um falhando deixa o check vermelho
      - name: testes (tests/*.test.sh)
        run: |
          rc=0
          for t in tests/*.test.sh; do
            echo "::group::$t"
            "$t" || { echo "::error::$t falhou"; rc=1; }
            echo "::endgroup::"
          done
          exit "$rc"
